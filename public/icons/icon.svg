<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#030712" rx="128" />
  
  <!-- Outer Glow Reticle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f3ff" stroke-width="8" stroke-dasharray="24 12" opacity="0.85" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#a855f7" stroke-width="4" opacity="0.6" />
  
  <!-- Circuit Nodes -->
  <circle cx="256" cy="46" r="10" fill="#00f3ff" />
  <circle cx="466" cy="256" r="10" fill="#ec4899" />
  <circle cx="256" cy="466" r="10" fill="#00f3ff" />
  <circle cx="46" cy="256" r="10" fill="#ec4899" />
  
  <!-- Circuit Traces -->
  <line x1="256" y1="46" x2="256" y2="110" stroke="#00f3ff" stroke-width="6" stroke-linecap="round" />
  <line x1="466" y1="256" x2="400" y2="256" stroke="#ec4899" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="466" x2="256" y2="400" stroke="#00f3ff" stroke-width="6" stroke-linecap="round" />
  <line x1="46" y1="256" x2="112" y2="256" stroke="#ec4899" stroke-width="6" stroke-linecap="round" />
  
  <!-- Antenna & Beacon -->
  <line x1="256" y1="160" x2="256" y2="100" stroke="#a855f7" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="90" r="16" fill="#ec4899" />
  
  <!-- Robot Head -->
  <rect x="136" y="160" width="240" height="190" rx="32" fill="#0f172a" stroke="#00f3ff" stroke-width="8" />
  
  <!-- Visor Screen -->
  <rect x="166" y="200" width="180" height="80" rx="16" fill="#020617" stroke="#334155" stroke-width="4" />
  
  <!-- Glowing Cyan Eyes -->
  <circle cx="210" cy="240" r="14" fill="#00f3ff" />
  <circle cx="302" cy="240" r="14" fill="#00f3ff" />
  
  <!-- Mouth Grid -->
  <line x1="200" y1="315" x2="312" y2="315" stroke="#a855f7" stroke-width="6" stroke-linecap="round" />
  <circle cx="226" cy="315" r="4" fill="#00f3ff" />
  <circle cx="256" cy="315" r="4" fill="#00f3ff" />
  <circle cx="286" cy="315" r="4" fill="#00f3ff" />
</svg>
